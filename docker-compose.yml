version: '3.8'

services:
  backend:
    build:
      context: ./infy/BackEnd
      dockerfile: Dockerfile
    container_name: smart_code_backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Platform Administrator}
      MONGODB_URI: ${MONGODB_URI:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:80,http://127.0.0.1:80}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    restart: always

  frontend:
    build:
      context: ./infy/FrontEnd
      dockerfile: Dockerfile
    container_name: smart_code_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
